spring.application.name=ApiGatewayFreelancers

server.port=9090
#config eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

#true pour activer le client config teb3a config server
spring.cloud.config.enabled=true 
#true pour activer le client config teb3a config server
spring.cloud.config.fail-fast=false
#pour dire que le client config  est optionnel et si il est pas la le projet marche normallement (teb3a config server)
spring.config.import=optional:configserver:http://localhost:8888

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/Projet_prospera
